# Palette: https://github.com/IGeraGera/sundial.nvim/blob/main/extras/vscode/first-light.json
name: first-light
description: Sundial First Light — warm paper and blue ink
colors:
  background: "#F3EDD3"
  ui_text: "#3B3833"
  ui_accent: "#4A6B7A"
  ui_label: "#3B3833"
  ui_border: "#B4AA84"
  ui_ok: "#546D2C"
  ui_warn: "#7A5F17"
  ui_error: "#9D2F3F"
  banner_accent: "#4A6B7A"
  banner_title: "#34567F"
  banner_text: "#3B3833"
  banner_dim: "#615C4D"
  banner_border: "#B4AA84"
  prompt: "#3B3833"
  input_rule: "#4A6B7A"
  response_border: "#4A6B7A"
  status_bar_bg: "#CCC7A6"
  status_bar_text: "#3B3833"
  status_bar_good: "#546D2C"
  status_bar_warn: "#7A5F17"
  status_bar_bad: "#9D2F3F"
  status_bar_critical: "#9D2F3F"
  session_label: "#34567F"
  session_border: "#B4AA84"
  completion_menu_bg: "#EFE8CB"
  completion_menu_current_bg: "#C3C5AE"
  syntax_string: "#8F5A12"
  syntax_number: "#715399"
  syntax_keyword: "#9D2F3F"
  syntax_comment: "#6B6657"

# Desktop only: reuse Sundial's warm paper surfaces and selection colors.
customCSS: |
  html:root {
    --ui-chat-bubble-background: #E9E1BF;
    --ui-chat-bubble-opaque-background: #E9E1BF;
    --ui-row-active-background: #C3C5AE;
    --conversation-scaffold-text: #615C4D;
    --conversation-scaffold-meta: #6B6657;
    --first-light-divider: color-mix(in srgb, #B4AA84 40%, transparent);
  }

  /* Hermes messenger: replace only the fresh conversation intro, not bot or board titles. */
  @media (forced-colors: none) {
    [data-slot='thread'] [data-slot='aui_intro'] > div {
      display: grid;
      grid-template-columns: clamp(3rem, 22%, 8.75rem) minmax(0, max-content);
      gap: 0 clamp(0.6rem, 4vw, 2.75rem);
      align-items: center;
      justify-content: center;
      text-align: left;
      max-width: min(var(--composer-width, 40rem), 100%);
    }
    [data-slot='thread'] [data-slot='aui_intro'] > div::before {
      content: '';
      grid-area: 1 / 1 / 3 / 2;
      width: 100%;
      aspect-ratio: 144 / 112;
      background: center / contain no-repeat url("data:image/svg+xml,%3Csvg%20class%3D%22mark%22%20viewBox%3D%220%200%20144%20112%22%20xmlns%3D%22http://www.w3.org/2000/svg%22%20fill%3D%22none%22%20stroke%3D%22%2334567F%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M94%2048c11-4%2018-13%2027-30%201%2010-2%2017-7%2023%207-2%2013-6%2019-13-2%2013-10%2022-21%2026%206%200%2012-2%2017-5-3%2010-11%2015-23%2016%22/%3E%3Cpath%20d%3D%22M31%2047h68a5%205%200%200%201%205%205v39a5%205%200%200%201-5%205H31a5%205%200%200%201-5-5V52a5%205%200%200%201%205-5Z%22%20fill%3D%22none%22/%3E%3Cpath%20d%3D%22m27%2050%2035%2025a5%205%200%200%200%206%200l35-25m-75%2042%2025-19m49%2019L77%2073%22/%3E%3Cpath%20d%3D%22M9%2062h9M4%2072h10m-4%2010h8%22%20stroke%3D%22%23615C4D%22%20stroke-width%3D%221%22/%3E%3Ccircle%20cx%3D%2265%22%20cy%3D%2275%22%20r%3D%224.5%22%20fill%3D%22%239D2F3F%22%20stroke%3D%22%23F3EDD3%22%20stroke-width%3D%221.15%22/%3E%3C/svg%3E");
    }
    [data-slot='thread'] [data-slot='aui_intro'] > div > .wordmark {
      grid-area: 1 / 2;
      align-self: end;
      display: flex;
      align-items: center;
      gap: 0.75em;
      width: auto !important;
      margin: 0;
      container-type: normal;
      mix-blend-mode: normal;
      color: #34567F;
      font: 600 11px/1.3 ui-monospace, monospace;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }
    [data-slot='thread'] [data-slot='aui_intro'] > div > .wordmark > span,
    [data-slot='thread'] [data-slot='aui_intro'] > div > p:not(.wordmark) { display: none; }
    [data-slot='thread'] [data-slot='aui_intro'] > div > .wordmark::before { content: 'Hermes'; }
    [data-slot='thread'] [data-slot='aui_intro'] > div > .wordmark::after {
      content: '';
      width: min(3.5rem, 13vw);
      height: 1px;
      background: #B4AA84;
    }
    [data-slot='thread'] [data-slot='aui_intro'] > div::after {
      content: 'A fresh page.';
      grid-area: 2 / 2;
      align-self: start;
      margin-top: 0.5rem;
      color: #3B3833;
      font: 400 clamp(1.5625rem, 5.6vw, 3.25rem)/1.04 Georgia, serif;
      letter-spacing: -0.045em;
    }
  }

  /* The preview/status shelf is a sibling of the composer, not its child. */
  [data-slot='composer-dock'] {
    --dt-card: #EFE8CB;
    --composer-fill: color-mix(in srgb, var(--dt-card) 88%, transparent);
  }
  [data-slot='composer-dock'][data-thread-scrolled-up]:not(:hover, :focus-within) {
    --composer-fill: color-mix(in srgb, var(--dt-card) 80%, transparent);
  }

  /* Give the terminal its own header without changing the terminal canvas. */
  [data-panel-header]:has([data-tree-tab='terminal'][aria-selected='true']) {
    --ui-sidebar-surface-background: #E9E1BF;
    background-color: var(--ui-sidebar-surface-background);
  }

  [data-panel-header]:has([data-tree-tab='terminal'][aria-selected='true'])::after {
    content: '';
    position: absolute;
    inset: 0 0 auto;
    height: 1px;
    background: #B4AA84;
    z-index: 1;
    pointer-events: none;
  }

  /* One hairline under list headers and document tab strips, without tint. */
  [data-panel-header]:has([data-tree-tab='sessions'][aria-selected='true'],
                          [data-tree-tab^='file:'][aria-selected='true'])::after {
    content: '';
    position: absolute;
    inset: auto 0 0;
    height: 1px;
    background: var(--first-light-divider);
    z-index: 1;
    pointer-events: none;
  }

  [class~='group/project-header'] {
    box-shadow: inset 0 -1px 0 var(--first-light-divider);
  }

  [data-slot='context-menu-content'],
  [data-slot='context-menu-sub-content'] {
    --ui-bg-elevated: #EFE8CB;
  }

  [data-slot='aui_changed-files'] {
    --ui-widget-surface-background: #EFE8CB;
  }

  .thread-jump-button {
    --composer-fill: #EFE8CB;
  }

  :is([data-slot='card-stack-surface'], [data-slot='card-stack-edge'])[class~='bg-popover/95'] {
    background-color: color-mix(in srgb, #EFE8CB 95%, transparent);
  }

  [data-slot='aui_assistant-message-content'] [data-conversation-scaffold],
  [data-slot='aui_background-result'] [data-conversation-scaffold],
  [data-slot='aui_background-resume'] {
    opacity: 0.84;
  }

  [data-slot='aui_assistant-message-content'] [data-slot='code-card'] {
    --ui-bg-editor: #EFE8CB;
    box-shadow: inset 0 0 0 1px #DED4AC;
  }
